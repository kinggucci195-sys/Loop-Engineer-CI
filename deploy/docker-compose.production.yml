services:
  orchestrator:
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 4000
      STATE_DIR: /app/state
      LOOPCI_POLICY_PATH: /app/config/loopci.config.json
    ports:
      - "4000:4000"
    volumes:
      - loopci-state:/app/state
      - ../loopci.config.json:/app/config/loopci.config.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:4000/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      STATE_DIR: /app/state
    volumes:
      - loopci-state:/app/state
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped

volumes:
  loopci-state:
