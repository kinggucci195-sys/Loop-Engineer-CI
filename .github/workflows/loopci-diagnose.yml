name: LoopCI Diagnose

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed GitHub Actions run id to diagnose"
        required: false
      include_log_excerpt:
        description: "Upload redacted failed log excerpt"
        required: false
        default: "false"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    name: Diagnose Failed CI
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build LoopCI packages
        run: |
          npm run build --workspace @loopci/contracts
          npm run build --workspace @loopci/config
          npm run build --workspace @loopci/logger
          npm run build --workspace @loopci/orchestrator

      - name: Capture failed logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          mkdir -p state
          gh run view "$RUN_ID" --json workflowName,conclusion,databaseId,headBranch,headSha,url > state/run.json
          node - <<'NODE'
          const { readFileSync } = require("node:fs");
          const run = JSON.parse(readFileSync("state/run.json", "utf8"));
          if (run.workflowName !== "CI" || run.conclusion !== "failure") {
            throw new Error(`Refusing to diagnose run ${run.databaseId}: expected failed CI workflow.`);
          }
          NODE
          gh run view "$RUN_ID" --json jobs > state/jobs.json
          gh run view "$RUN_ID" --log-failed > state/failed-log.txt
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const raw = readFileSync("state/failed-log.txt", "utf8").slice(0, 11000);
          const redacted = raw
            .replace(/(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]+/g, "[REDACTED_GITHUB_TOKEN]")
            .replace(/sk-[A-Za-z0-9_-]{20,}/g, "[REDACTED_OPENAI_KEY]")
            .replace(/AKIA[0-9A-Z]{16}/g, "[REDACTED_AWS_ACCESS_KEY]")
            .replace(/(?<=password=)[^\\s&]+/gi, "[REDACTED]")
            .replace(/(?<=token=)[^\\s&]+/gi, "[REDACTED]")
            .replace(/(?<=secret=)[^\\s&]+/gi, "[REDACTED]");
          writeFileSync("state/failed-log-excerpt.txt", redacted);
          NODE

      - name: Build failure event
        env:
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const run = JSON.parse(readFileSync("state/run.json", "utf8"));
          const jobs = JSON.parse(readFileSync("state/jobs.json", "utf8")).jobs || [];
          const failedJob = jobs.find((job) => job.conclusion === "failure") || jobs[0] || {};
          const failedStep = (failedJob.steps || []).find((step) => step.conclusion === "failure") || {};
          const excerpt = readFileSync("state/failed-log-excerpt.txt", "utf8") || "No failed log excerpt captured.";
          const payload = {
            provider: "github-actions",
            repository: process.env.GITHUB_REPOSITORY,
            workflow: run.workflowName,
            runId: process.env.RUN_ID,
            runUrl: run.url,
            commitSha: run.headSha,
            branch: run.headBranch,
            failedJob: failedJob.name || "unknown",
            failedStep: failedStep.name || "failed GitHub Actions step",
            logExcerpt: excerpt
          };
          writeFileSync("state/failure-event.json", JSON.stringify(payload, null, 2));
          NODE

      - name: Diagnose with LoopCI
        env:
          LOOPCI_AI_PROVIDER: heuristic
        run: npm run diagnose --workspace @loopci/orchestrator -- state/failure-event.json state/loopci-repair-plan.md

      - name: Upload repair plan
        uses: actions/upload-artifact@v4
        with:
          name: loopci-repair-plan
          path: |
            state/failure-event.json
            state/loopci-repair-plan.md

      - name: Upload redacted log excerpt
        if: ${{ inputs.include_log_excerpt == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: loopci-redacted-log-excerpt
          path: state/failed-log-excerpt.txt
