name: LoopCI Diagnose

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed GitHub Actions run id to diagnose"
        required: false

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    name: Diagnose Failed CI
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build LoopCI packages
        run: |
          npm run build --workspace @loopci/contracts
          npm run build --workspace @loopci/config
          npm run build --workspace @loopci/logger
          npm run build --workspace @loopci/orchestrator

      - name: Capture failed logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          mkdir -p state
          gh run view "$RUN_ID" --log-failed > state/failed-log.txt || true
          head -c 11000 state/failed-log.txt > state/failed-log-excerpt.txt

      - name: Build failure event
        env:
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, inputs.run_id) }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const excerpt = readFileSync("state/failed-log-excerpt.txt", "utf8") || "No failed log excerpt captured.";
          const payload = {
            provider: "github-actions",
            repository: process.env.GITHUB_REPOSITORY,
            workflow: "CI",
            runId: process.env.RUN_ID,
            runUrl: process.env.RUN_URL,
            commitSha: process.env.HEAD_SHA,
            branch: process.env.HEAD_BRANCH,
            failedJob: "unknown",
            failedStep: "failed GitHub Actions step",
            logExcerpt: excerpt
          };
          writeFileSync("state/failure-event.json", JSON.stringify(payload, null, 2));
          NODE

      - name: Diagnose with LoopCI
        env:
          LOOPCI_AI_PROVIDER: heuristic
        run: npm run diagnose --workspace @loopci/orchestrator -- state/failure-event.json state/loopci-repair-plan.md

      - name: Upload repair plan
        uses: actions/upload-artifact@v4
        with:
          name: loopci-repair-plan
          path: |
            state/failure-event.json
            state/failed-log-excerpt.txt
            state/loopci-repair-plan.md
